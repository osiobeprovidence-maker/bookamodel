<!doctype html>
<html lang="en">
  <head>

    <meta name="theme-color" content="#111111" />
    <title>BOOKAMODEL</title>
    <style>
      html, body { height: 100%; margin: 0; background: #111111; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }

      button { background: #d4af37; color: #111111; border: none; border-radius: 14px; padding: 12px 28px; font-size: 14px; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <div>
      <img class="logo" src="/icons/icon-192.png" alt="BookAModel" />
      <h1>You're offline</h1>
      <p>BookAModel can't reach the internet right now. Check your connection and try again.</p>
      <button onclick="window.location.reload()">Retry</button>
    </div>
